<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini App Storefront</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--telegram-bg-color, #ffffff);
      --text: var(--telegram-text-color, #000000);
      --hint: var(--telegram-hint-color, #888888);
      --btn: var(--telegram-button-color, #2481cc);
      --btn-text: var(--telegram-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    .card {
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
    .price { font-weight: bold; margin: 8px 0; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button {
      background-color: var(--btn);
      color: var(--btn-text);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🛍️ Store Catalog</h2>
  <div class="grid" id="catalog"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expand Mini App to full screen

    const PRODUCTS = [
      { id: "p1", name: "Headphones", price: 49.99, img: "https://via.placeholder.com/150" },
      { id: "p2", name: "Smart Watch", price: 89.99, img: "https://via.placeholder.com/150" },
      { id: "p3", name: "Backpack", price: 29.99, img: "https://via.placeholder.com/150" }
    ];

    let cart = {};

    function renderCatalog() {
      const container = document.getElementById("catalog");
      container.innerHTML = PRODUCTS.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <h4>${p.name}</h4>
          <div class="price">$${p.price}</div>
          <div class="controls">
            <button onclick="updateCart('${p.id}', -1)">-</button>
            <span id="qty-${p.id}">${cart[p.id] ? cart[p.id].quantity : 0}</span>
            <button onclick="updateCart('${p.id}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function updateCart(prodId, delta) {
      const product = PRODUCTS.find(p => p.id === prodId);
      if (!cart[prodId]) cart[prodId] = { ...product, quantity: 0 };
      
      cart[prodId].quantity += delta;
      if (cart[prodId].quantity <= 0) delete cart[prodId];

      document.getElementById(`qty-${prodId}`).innerText = cart[prodId] ? cart[prodId].quantity : 0;
      updateMainButton();
    }

    function updateMainButton() {
      const items = Object.values(cart);
      const totalCount = items.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = items.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);

      if (totalCount > 0) {
        tg.MainButton.setText(`VIEW CART (${totalCount}) • $${totalPrice}`);
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
    }

    // Send order data back to Telegram Bot when MainButton is pressed
    tg.MainButton.onClick(() => {
      const orderPayload = {
        items: Object.values(cart),
        totalAmount: Object.values(cart).reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2)
      };
      tg.sendData(JSON.stringify(orderPayload)); // Sends payload to python backend
    });

    renderCatalog();
  </script>
</body>
</html>
